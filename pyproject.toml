[project]
name = "weak-to-strong-daisy-chain"
version = "0.1.0"
description = "Weak-to-strong generalization replication and daisy-chain extension"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end runs that download small models (deselect with -m 'not integration')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
