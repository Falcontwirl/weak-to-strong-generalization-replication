# base_full_48gb plus Pythia-2.8B, fully fine-tuned with 8-bit AdamW (bitsandbytes) so it fits a 48 GB L40S.
# Only p2.8b uses the 8-bit optimizer (a per-model setting); the other models' jobs keep their cache keys, so
#   EXTRA="--reuse-from outputs/base_full_48gb-1b976761"
# retrains only the new jobs: p1.4b as a teacher, the p2.8b ceiling, and the 4 pairs into p2.8b (x 3 seeds).
experiment: base_w2s
name: base_full_2p8b
seeds: [0, 1, 2]
splits:
  split_seed: 1234
  sizes: {val: 1000, weak_train: 5000, strong_train: 5000}
models:
  - {name: p160m, id: EleutherAI/pythia-160m, params: 1.6e8, lr: 5.0e-5, batch_size: 32}
  - {name: p410m, id: EleutherAI/pythia-410m, params: 4.1e8, lr: 3.0e-5, batch_size: 32}
  - {name: p1b,   id: EleutherAI/pythia-1b,   params: 1.0e9, lr: 2.0e-5, batch_size: 32}
  - {name: p1.4b, id: EleutherAI/pythia-1.4b, params: 1.4e9, lr: 1.5e-5, batch_size: 32}
  - {name: p2.8b, id: EleutherAI/pythia-2.8b, params: 2.8e9, lr: 1.0e-5, batch_size: 32, optimizer: adamw8bit}
train:
  epochs: 2
  max_length: 128
  evals_per_epoch: 2
  loss: soft_ce
  selection: auto
  save_checkpoints: false
base_w2s:
  pairs: all
