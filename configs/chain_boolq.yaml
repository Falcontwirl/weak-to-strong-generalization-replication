# Daisy chain on BoolQ: GT -> M1 (160M) -> M2 (410M) -> M3 (1B) -> M4 (1.4B) vs direct pairs, 3 seeds.
# SST-2 saturated at ~0.90, so chain vs direct was a null result there; BoolQ leaves real headroom.
# BoolQ train has 9427 examples, so each of the 4 generation splits gets 2000 (vs 4000 in boolq_base):
# val 1000 + 4 x 2000 = 9000. Splits differ from boolq_base, so no jobs are shared with it.
experiment: daisy_chain
name: chain_boolq
seeds: [0, 1, 2]
dataset:
  path: google/boolq
  name: null
  text_field: passage
  label_field: answer
  text_template: "Passage: {passage}\nQuestion: {question}?\nAnswer:"
  label_names: ["no", "yes"]
  train_split: train
  test_split: validation
splits:
  split_seed: 1234
  sizes: {val: 1000, seed_true_train: 2000, g2: 2000, g3: 2000, g4: 2000}
models:
  - {name: p160m, id: EleutherAI/pythia-160m, params: 1.6e8, lr: 5.0e-5, batch_size: 32}
  - {name: p410m, id: EleutherAI/pythia-410m, params: 4.1e8, lr: 3.0e-5, batch_size: 32}
  - {name: p1b,   id: EleutherAI/pythia-1b,   params: 1.0e9, lr: 2.0e-5, batch_size: 32}
  - {name: p1.4b, id: EleutherAI/pythia-1.4b, params: 1.4e9, lr: 1.5e-5, batch_size: 32}
train:
  epochs: 2
  max_length: 256
  truncation_side: left
  evals_per_epoch: 2
  loss: soft_ce
  selection: auto
  eval_batch_size: 32
  save_checkpoints: false
zero_shot:
  prompt: "{text}"
  verbalizers: [" no", " yes"]
daisy_chain:
  direct: auto   # all pairs skipping >= 1 rung: p160m->p1b, p160m->p1.4b, p410m->p1.4b
