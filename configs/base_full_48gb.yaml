# Full base W2S experiment sized for a 48 GB card (L40S): Pythia 160M/410M/1B/1.4B, all 6 pairs, 3 seeds.
# 2.8B full fine-tuning (~45 GB weights+grads+AdamW before activations) does not fit on 48 GB, so 1.4B tops the ladder.
experiment: base_w2s
name: base_full_48gb
seeds: [0, 1, 2]
splits:
  split_seed: 1234
  sizes: {val: 1000, weak_train: 5000, strong_train: 5000}
models:
  - {name: p160m, id: EleutherAI/pythia-160m, params: 1.6e8, lr: 5.0e-5, batch_size: 32}
  - {name: p410m, id: EleutherAI/pythia-410m, params: 4.1e8, lr: 3.0e-5, batch_size: 32}
  - {name: p1b,   id: EleutherAI/pythia-1b,   params: 1.0e9, lr: 2.0e-5, batch_size: 32}
  - {name: p1.4b, id: EleutherAI/pythia-1.4b, params: 1.4e9, lr: 1.5e-5, batch_size: 32}
train:
  epochs: 2
  max_length: 128
  evals_per_epoch: 2
  loss: soft_ce
  selection: auto
  save_checkpoints: false   # set true to keep bf16 weights per job (~30 GB per seed for this config)
base_w2s:
  pairs: all
