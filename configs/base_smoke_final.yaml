# Ablation of base_smoke: checkpoint selection = final step (instead of auto).
experiment: base_w2s
name: base_smoke_final
seeds: [0]
splits:
  split_seed: 1234
  sizes: {val: 500, weak_train: 1000, strong_train: 1000}
models:
  - {name: p70m,  id: EleutherAI/pythia-70m,  params: 7.0e7,  lr: 1.0e-4, batch_size: 32}
  - {name: p160m, id: EleutherAI/pythia-160m, params: 1.6e8,  lr: 5.0e-5, batch_size: 32}
  - {name: p410m, id: EleutherAI/pythia-410m, params: 4.1e8,  lr: 3.0e-5, batch_size: 32}
train:
  epochs: 2
  max_length: 128
  evals_per_epoch: 2
  selection: final
