# Full daisy-chain experiment: GT -> M1 (160M) -> M2 (410M) -> M3 (1B) -> M4 (2.8B), 3 seeds.
# Conditions per seed: seed M1, chain M2..M4, GT upper bounds M2..M4, direct M1->M3, M1->M4, M2->M4.
# Budget: ~1 hour on a single A100 80GB (run `--dry-run` for an estimate).
experiment: daisy_chain
name: chain_full
seeds: [0, 1, 2]
splits:
  split_seed: 1234
  sizes: {val: 1000, seed_true_train: 5000, g2: 5000, g3: 5000, g4: 5000}
models:
  - {name: p160m, id: EleutherAI/pythia-160m, params: 1.6e8, lr: 5.0e-5, batch_size: 32}
  - {name: p410m, id: EleutherAI/pythia-410m, params: 4.1e8, lr: 3.0e-5, batch_size: 32}
  - {name: p1b,   id: EleutherAI/pythia-1b,   params: 1.0e9, lr: 2.0e-5, batch_size: 32}
  - {name: p2.8b, id: EleutherAI/pythia-2.8b, params: 2.8e9, lr: 1.0e-5, batch_size: 32}
train:
  epochs: 2
  max_length: 128
  evals_per_epoch: 2
  loss: soft_ce
  selection: auto
  save_checkpoints: false
daisy_chain:
  direct: auto   # all pairs skipping >= 1 rung: p160m->p1b, p160m->p2.8b, p410m->p2.8b
